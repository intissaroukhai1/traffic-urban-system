name: Traffic Urban System CI

on:
  push:
    branches:
      - main
      - feature-branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - api-gateway
          - auth-service
          - vehicle-service
          - traffic-service
          - incident-service
          - notification-service
          - dashboard-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm install

      - name: Build project
        working-directory: ${{ matrix.project }}
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - traffic-service
          - incident-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm install

      - name: Run unit tests
        working-directory: ${{ matrix.project }}
        run: npm run test